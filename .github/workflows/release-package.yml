name: Release package

on:
  push:
    tags:
      - 'v*'

permissions:
  # contents: write creates the GitHub Release whose asset the Homebrew formula pins.
  contents: write
  packages: write

concurrency:
  group: release-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-15
    outputs:
      version: ${{ steps.release_asset.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4

      - name: Verify macOS arm64 runner
        run: test "$(uname -m)" = arm64

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release tag
        run: pnpm release:check-tag

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Test packed package
        run: pnpm test:package

      - name: Test packed package with launchd
        run: pnpm test:launchd

      - name: Publish to GitHub Packages
        run: |
          printf '%s\n' '@ty91:registry=https://npm.pkg.github.com' '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' > "$RUNNER_TEMP/npmrc"
          NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc" pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test published package
        run: |
          package_version=$(node -p "require('./package.json').version")
          sky_smoke_home="$RUNNER_TEMP/sky-registry-smoke"
          mkdir -p "$sky_smoke_home/pnpm"
          export HOME="$sky_smoke_home"
          export PNPM_HOME="$sky_smoke_home/pnpm"
          export XDG_CACHE_HOME="$sky_smoke_home/cache"
          export XDG_CONFIG_HOME="$sky_smoke_home/config"
          export XDG_DATA_HOME="$sky_smoke_home/data"
          export PATH="$PNPM_HOME/bin:$PNPM_HOME:$PATH"
          NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc" pnpm add --global "@ty91/sky@$package_version"
          sky_bin="$(pnpm bin --global | tail -n 1)/sky"
          test "$("$sky_bin" --version)" = "$package_version"
          "$sky_bin" --help | grep -q 'Usage: sky'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pack the release asset
        id: release_asset
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p "$RUNNER_TEMP/release"
          pnpm pack --pack-destination "$RUNNER_TEMP/release"
          # The formula pins this exact name; test/package-release.smoke.mjs guards it.
          tarball="$RUNNER_TEMP/release/ty91-sky-$version.tgz"
          test -f "$tarball"
          {
            echo "version=$version"
            echo "tarball=$tarball"
            echo "sha256=$(shasum -a 256 "$tarball" | cut -d ' ' -f 1)"
          } >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub Release
        run: gh release create "$GITHUB_REF_NAME" "$TARBALL" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARBALL: ${{ steps.release_asset.outputs.tarball }}

      - name: Point the Homebrew tap at this release
        run: |
          node scripts/render-homebrew-formula.mjs \
            --sha256 "$SHA256" --version "$VERSION" --out "$RUNNER_TEMP/sky.rb"
          git clone --depth 1 "https://x-access-token:$TAP_TOKEN@github.com/ty91/homebrew-tap.git" \
            "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Formula"
          cp "$RUNNER_TEMP/sky.rb" "$RUNNER_TEMP/tap/Formula/sky.rb"
          git -C "$RUNNER_TEMP/tap" add Formula/sky.rb
          if git -C "$RUNNER_TEMP/tap" diff --cached --quiet; then
            echo "The tap already pins $VERSION."
            exit 0
          fi
          git -C "$RUNNER_TEMP/tap" \
            -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "sky $VERSION"
          git -C "$RUNNER_TEMP/tap" push
        env:
          TAP_TOKEN: ${{ secrets.TAP_REPO_TOKEN }}
          SHA256: ${{ steps.release_asset.outputs.sha256 }}
          VERSION: ${{ steps.release_asset.outputs.version }}

  # Installs the tap the way a user would, so it has to wait for the formula bump.
  homebrew-smoke:
    needs: publish
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4

      - name: Verify macOS arm64 runner
        run: test "$(uname -m)" = arm64

      - name: Smoke the published tap
        run: pnpm test:homebrew
        env:
          SKY_HOMEBREW_SMOKE: '1'
          SKY_HOMEBREW_VERSION: ${{ needs.publish.outputs.version }}
