name: Release standalone

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-standalone-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    outputs:
      version: ${{ steps.release_assets.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4

      - name: Verify macOS arm64 runner
        run: test "$(uname -m)" = arm64

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release tag
        run: pnpm release:check-tag

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build standalone
        run: pnpm build:standalone

      - name: Test standalone
        run: pnpm test:standalone

      - name: Test standalone with launchd
        run: pnpm test:launchd:standalone

      - name: Package standalone
        run: pnpm package:standalone

      - name: Test standalone package
        run: pnpm test:standalone:package

      - name: Resolve release assets
        id: release_assets
        run: |
          version=$(node -p "require('./package.json').version")
          archive="$PWD/dist/release/sky-$version-darwin-arm64.tar.gz"
          checksum="$archive.sha256"
          test -f "$archive"
          test -f "$checksum"
          {
            echo "version=$version"
            echo "archive=$archive"
            echo "checksum=$checksum"
          } >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub Release
        run: |
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            "$ARCHIVE" \
            "$CHECKSUM" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${release_flags[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCHIVE: ${{ steps.release_assets.outputs.archive }}
          CHECKSUM: ${{ steps.release_assets.outputs.checksum }}

  release-smoke:
    needs: release
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4

      - name: Verify macOS arm64 runner
        run: test "$(uname -m)" = arm64

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build lower-version standalone
        run: |
          pnpm pkg set "version=$SMOKE_VERSION"
          pnpm build:standalone
          pnpm package:standalone
        env:
          SMOKE_VERSION: 0.0.0-smoke

      - name: Smoke install and update from the published release
        run: node --test test/release-install-update.smoke.mjs
        env:
          SKY_RELEASE_SMOKE: '1'
          SKY_RELEASE_VERSION: ${{ needs.release.outputs.version }}
          SKY_RELEASE_SMOKE_VERSION: 0.0.0-smoke
          SKY_RELEASE_SMOKE_ARTIFACT_DIR: ${{ github.workspace }}/dist/release
